<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Khang Phan - Software Engineer</title>
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.2);
      --glass-border: rgba(255, 255, 255, 0.35);
      --text-main: #0f172a;
      --text-subtle: #334155;
      --button-bg: rgba(15, 23, 42, 0.75);
      --button-bg-hover: rgba(15, 23, 42, 0.92);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text-main);
      background:
        linear-gradient(rgba(8, 15, 32, 0.35), rgba(8, 15, 32, 0.45)),
        url("./modern-workspace-flat-lay-with-keyboard-tablet-and-succulents-on-white-background-photo.jpeg")
        center/cover no-repeat fixed;
    }

    .card {
      width: min(92vw, 680px);
      border-radius: 22px;
      padding: 40px 34px;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      backdrop-filter: blur(14px) saturate(120%);
      -webkit-backdrop-filter: blur(14px) saturate(120%);
      box-shadow:
        0 20px 40px rgba(2, 8, 23, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.45);
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 4vw, 2.8rem);
      line-height: 1.15;
      letter-spacing: 0.4px;
    }

    p {
      margin: 0 0 26px;
      color: var(--text-subtle);
      font-size: clamp(1rem, 2vw, 1.1rem);
    }

    .glass-button {
      border: 1px solid rgba(255, 255, 255, 0.28);
      color: #ffffff;
      background: var(--button-bg);
      border-radius: 999px;
      padding: 12px 24px;
      font-size: 0.98rem;
      font-weight: 600;
      letter-spacing: 0.2px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: transform 0.18s ease, background 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.25);
    }

    .glass-button:hover {
      background: var(--button-bg-hover);
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(15, 23, 42, 0.3);
    }

    .glass-button:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <section class="card" aria-label="Profile card">
    <h1>Khang Phan</h1>
    <p>Modern workspace profile card</p>
    <button class="glass-button" type="button">Software Engineer</button>
  </section>
</body>
</html>
